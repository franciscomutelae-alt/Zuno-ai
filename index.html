    <style>
      html,
      body {
        margin: 0;
        background-color: #050814;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .zuno-boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 30% 25%, rgba(37, 99, 235, 0.16), transparent 45%),
          radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.16), transparent 45%),
          #050814;
      }
      .zuno-boot-badge {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 22px;
        border-radius: 18px;
        background: rgba(8, 13, 30, 0.92);
        border: 1px solid rgba(59, 130, 246, 0.28);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .zuno-boot-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #ffffff;
      }
      .zuno-boot-title span {
        background: linear-gradient(90deg, #38bdf8, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .zuno-boot-slogan {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #93c5fd;
      }
    </style>

    <script>
      // Suppress external browser extension unhandled rejections cleanly
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('chrome: call method') ||
          msg.includes('Window message') ||
          msg.includes('WebSocket closed without opened') ||
          stack.includes('chrome-extension://') ||
          stack.includes('moz-extension://') ||
          stack.includes('ff-content.js')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var filename = event.filename || '';
        var msg = (event.message || '') + '';
        if (
          filename.includes('chrome-extension://') ||
          filename.includes('moz-extension://') ||
          filename.includes('ff-content.js') ||
          msg.includes('chrome: call method')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
